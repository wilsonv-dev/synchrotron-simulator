# Publica el simulador en GitHub Pages en cada push a main.
# La versión publicada no necesita servidor: el motor Python (backend/app) se ejecuta en el navegador con
# Pyodide. Antes de publicar se ejecutan las pruebas del motor con Python 3.13 (la misma versión que Pyodide).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias del motor
        run: pip install -r backend/requirements.txt
      - name: Pruebas del motor físico
        working-directory: backend
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias de la interfaz
        working-directory: frontend
        run: npm ci
      - name: Compilar (motor en el navegador con Pyodide)
        working-directory: frontend
        env:
          VITE_ENGINE: pyodide
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
